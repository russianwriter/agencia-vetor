<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Um gráfico circular que reequilibra a divisão entre mídia paga e orgânica" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="800" fill="#111827"/>
  <circle cx="600" cy="400" r="228" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="2 14" opacity="0.28">
    <animateTransform attributeName="transform" type="rotate" from="0 600 400" to="360 600 400" dur="60s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="400" r="150" fill="none" stroke="#fff" stroke-width="36" opacity="0.92"/>
  <circle cx="600" cy="400" r="150" fill="none" stroke="#F26522" stroke-width="36" stroke-dasharray="377 565.5" transform="rotate(-90 600 400)">
    <animate attributeName="stroke-dasharray" values="377 565.5;565 377.5;377 565.5" dur="7s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="400" r="9" fill="#F26522">
    <animate attributeName="r" values="9;13;9" dur="7s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
  </circle>
</svg>
