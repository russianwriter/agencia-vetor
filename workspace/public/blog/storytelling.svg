<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Uma linha narrativa que se desenha passando por pontos até o desfecho" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="800" fill="#EFEFEF"/>
  <line x1="150" y1="580" x2="1050" y2="580" stroke="#111827" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.15"/>
  <g>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
    <path id="arc" d="M150 500 C330 500 360 300 520 300 C680 300 700 460 820 430 C920 405 960 250 1050 230" pathLength="1" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;0.55;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <circle cx="150" cy="500" r="10" fill="#111827"/>
    <circle cx="520" cy="300" r="10" fill="#111827" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.23;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="430" r="10" fill="#111827" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.37;0.4;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="230" r="14" fill="#F26522" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.56;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="11" fill="#F26522">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.55;0.57;1" dur="8s" repeatCount="indefinite"/>
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.55;1">
